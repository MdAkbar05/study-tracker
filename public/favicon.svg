<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a63f5"/>
      <stop offset="100%" stop-color="#3835cf"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="32" height="16" rx="8" fill="url(#shine)"/>

  <!-- Book body -->
  <rect x="6" y="8" width="20" height="16" rx="2" fill="white" fill-opacity="0.18"/>

  <!-- Left page -->
  <rect x="7" y="9" width="9" height="14" rx="1.5" fill="white" fill-opacity="0.9"/>
  <!-- Right page -->
  <rect x="16" y="9" width="9" height="14" rx="1.5" fill="white" fill-opacity="0.75"/>

  <!-- Spine line -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#4444ea" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Lines on left page -->
  <line x1="9"  y1="13" x2="14" y2="13" stroke="#5a63f5" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="9"  y1="16" x2="14" y2="16" stroke="#5a63f5" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="9"  y1="19" x2="12" y2="19" stroke="#5a63f5" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Lines on right page -->
  <line x1="18" y1="13" x2="23" y2="13" stroke="#7888fa" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="18" y1="16" x2="23" y2="16" stroke="#7888fa" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="18" y1="19" x2="21" y2="19" stroke="#7888fa" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Bottom shadow strip -->
  <rect x="6" y="22" width="20" height="2" rx="1" fill="black" fill-opacity="0.12"/>
</svg>
